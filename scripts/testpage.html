<!doctype html><meta charset="utf-8"><title>agweb test</title>
<h1>agweb test</h1>
<button id="b">Press me</button>
<form id="f" onsubmit="event.preventDefault(); log.push('submit:' + q.value)"><input id="q" placeholder="Search"><select id="s"><option value="1">One</option><option value="2">Two</option></select></form>
<input type="file" id="file">
<input type="password" id="pw">
<button id="pop" onclick="window.open('/index.html?popup')">Open popup</button>
<button id="al" onclick="alert('hi')">Alert</button>
<a href="/index.html?next">Next page</a>
<input type="range" id="rng" min="0" max="100" value="0" style="width:300px">
<div id="card" draggable="true" style="display:inline-block;padding:8px;background:#ddd">card</div>
<div id="lane" style="display:inline-block;width:120px;height:40px;background:#eef">lane</div>
<label><input type="checkbox" id="cb"> Remember me</label>
<input type="radio" name="r" id="r1" value="a"><input type="radio" name="r" id="r2" value="b">
<button id="pr" onclick="log.push('prompt:' + prompt('Name?', 'def'))">Prompt</button>
<a id="dl" href="/index.html" download="saved.html">Download</a>
<button id="api" onclick="fetch('/index.html?api', { method: 'POST', body: 'x=1', headers: { 'x-req': 'yes' } }).then(r => r.text()).then(t => api = t)">Call API</button>
<table id="tb"><tr><th>Fruit</th><th>Action</th></tr><tr><td>Apples</td><td><button onclick="bought = 'apples'">Buy</button></td></tr></table>
<a id="blank" href="/index.html?blank" target="_blank">Blank link</a>
<table id="dt"><tr><td><a class="link"><span aria-hidden="true">lens</span><span id="deploy" tabindex="0">deploy to TEST</span></a></td></tr></table>
<button id="slow" onclick="fetch('/index.html?delay=800').then(r => r.text()).then(() => slowDone = 1)">Slow call</button>
<iframe id="fr" src="/frame.html" title="inner" style="width:300px;height:60px"></iframe>
<span id="lbl">Shipping speed</span><div id="cbx" role="combobox" aria-labelledby="lbl" aria-expanded="true" tabindex="0">Express<div role="listbox"><div role="option" aria-selected="true">Express</div><div role="option">Standard</div></div></div>
<a href="#dev" title="Programmer">Developers</a>
<div role="button" tabindex="0">Search <input id="dq" aria-label="Find"></div>
<div style="height:3000px"></div>
<!-- react-bootstrap 1.0 leaves aria-hidden on its open modal -->
<div id="rbm" role="dialog" aria-modal="true" aria-hidden="true"><button id="far">Far button</button></div>
<div id="box" style="height:60px;overflow:auto"><div style="height:600px"></div><button id="deep">Deep button</button></div>
<button id="gone" style="display:none">Gone button</button>
<script>
window.log = [];
window.moves = 0;
window.inputs = 0;
window.dbl = 0;
window.dropped = '';
window.api = '';
window.downs = [];
addEventListener('mousedown', e => downs.push(e.button + (e.shiftKey ? '+shift' : '')));
b.addEventListener('contextmenu', () => log.push('contextmenu'));
b.addEventListener('dblclick', () => dbl++);
card.addEventListener('dragstart', e => e.dataTransfer.setData('text/plain', 'card'));
lane.addEventListener('dragover', e => e.preventDefault());
lane.addEventListener('drop', e => { e.preventDefault(); dropped = e.dataTransfer.getData('text/plain'); });
q.addEventListener('input', () => inputs++);
addEventListener('mousemove', e => { if (e.isTrusted) moves++; });
b.addEventListener('click', e => log.push('click trusted=' + e.isTrusted));
q.addEventListener('keydown', e => log.push('keydown ' + e.key + ' trusted=' + e.isTrusted));
file.addEventListener('change', () => log.push('file:' + file.files[0]?.name));
console.log('loaded', location.search);
// Like a deploy button that opens a window after a fetch: the window opens after a fetch the click started, outside WebKit's gesture.
deploy.addEventListener('click', () => fetch('/index.html?delay=300').then(() => open('/index.html?deployed')));
</script>
